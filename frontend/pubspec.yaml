name: mtg_deck_analyzer
description: A Flutter application for analyzing and validating Magic The Gathering decks
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^9.1.1
  freezed_annotation: ^3.1.0

  # Dependency Injection
  get_it: ^8.2.0

  # Functional Programming
  dartz: ^0.10.1

  # Network
  http: ^1.1.0
  connectivity_plus: ^7.0.0

  # Storage
  shared_preferences: ^2.2.2

  # UI Components
  google_fonts: ^6.1.0
  cached_network_image: ^3.3.0

  # Utils
  equatable: ^2.0.5
  uuid: ^4.2.1

  # Icons
  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code Generation
  build_runner: ^2.7.1
  freezed: ^3.2.3
  json_serializable: ^6.7.1

  # Testing
  mockito: ^5.5.0
  bloc_test: ^10.0.0

  # Linting
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Assets
  assets:
    - assets/images/
    - assets/icons/

  # Fonts
  fonts:
    - family: Roboto
      fonts:
        - asset: fonts/Roboto-Regular.ttf
        - asset: fonts/Roboto-Bold.ttf
          weight: 700
